name: Delete release

# Maintenance: removes a GitHub release and its tag (e.g. to renumber versions).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of the release to delete (e.g. v1.1.0)'
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes \
            || gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG"
