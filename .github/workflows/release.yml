name: Build and release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g. 1.0.0)'
        required: true
        default: '1.1.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android build tools (Ubuntu packages)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends aapt zipalign apksigner dalvik-exchange

      - name: Version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then V="${{ inputs.version }}"; else V="${GITHUB_REF_NAME#v}"; fi
          echo "name=$V" >> "$GITHUB_OUTPUT"

      - name: Cache Android platform jars
        uses: actions/cache@v4
        with:
          path: ~/.cache/stave-build
          key: stave-android-all-14-15

      - name: Unit tests
        run: tools/test.sh

      - name: Build APK
        env:
          VERSION_NAME: ${{ steps.v.outputs.name }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          tools/build.sh
          cp build/stave.apk "stave-${VERSION_NAME}.apk"
          sha256sum "stave-${VERSION_NAME}.apk" > "stave-${VERSION_NAME}.apk.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.name }}
        run: |
          gh release create "v$V" "stave-$V.apk" "stave-$V.apk.sha256" \
            --title "Stave $V" --target "${{ github.sha }}" \
            --notes "Android port of MuseScore's notation editor. Install stave-$V.apk on Android 7.0+ (allow installing unknown apps). Signed with the public debug key in keystore/; see README." \
            || gh release upload "v$V" "stave-$V.apk" "stave-$V.apk.sha256" --clobber
