plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.vlesk.stave'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.vlesk.stave'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
